name: ai-review

# Advisory AI review, posted as one comment that is updated on every push.
#
# pull_request_target runs THIS file and the script from the base branch (main),
# so a pull request cannot change what runs here. The job only reads the pull
# request's diff through the API; it never checks out or executes pull-request
# code. The OpenRouter key is a secret of the `ai-review` environment, whose
# deployment branch policy allows only `main` - a workflow on a learner's branch
# cannot use it. Keep all three properties when editing this file.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: ai-review
    timeout-minutes: 5
    steps:
      - name: Check out the base branch (trusted script and guidelines only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Review the diff (read as text, never executed)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/ai_review.py
