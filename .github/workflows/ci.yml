name: ci

# Quality checks on every pull request. GitHub-hosted runner, read-only token,
# no secrets. Never add `runs-on: self-hosted`.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Producers and connectors
        run: python .github/scripts/check_ingestion.py
